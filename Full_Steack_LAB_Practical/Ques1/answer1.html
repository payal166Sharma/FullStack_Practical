
<!DOCTYPE html>
<html>
<head>
    <title>Concentric Circles</title>
    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 300px;
        }

        .outer {
            width: 60px;
            height: 60px;
            background-color: green;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .middle {
            width: 40px;
            height: 40px;
            background-color: blue;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .inner {
            width: 20px;
            height: 20px;
            background-color: red;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="outer">
            <div class="middle">
                <div class="inner"></div>
            </div>
        </div>
    </div>

</body>
</html>
